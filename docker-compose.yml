version: "3.8"

services:
  db:
    image: postgres:15
    container_name: django_db
    # Không mở port ra ngoài Windows
    ports:
      - "5433:5432" # <--- MỞ CỔNG Ở ĐÂY (Ngoài:Trong)
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD lấy từ file .env (xem .env.example)
    env_file: .env
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Đặt PGADMIN_PASSWORD trong .env}
    ports:
      ["5050:80"]
    depends_on:
      - db

  redis:
    image: redis/redis-stack-server:latest # Use the lightweight, standard version
    container_name: django_redis
    restart: always
    # command: >
    #   redis-server 
    #   --maxmemory 1024mb 
    #   --maxmemory-policy allkeys-lru
    environment:
      - REDIS_ARGS=--maxmemory 1024mb --maxmemory-policy volatile-lru
    # command: >
    #   redis-server 
    #   --maxmemory-policy allkeys-lru
    #   --appendonly yes
    volumes:
      - redis_data:/data
    # Không mở port, web và worker vẫn thấy nó qua tên "redis"

  web:
    build: .
    container_name: django_web
    command: uvicorn flashcardApi.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    # container_name: django_worker
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G # Nâng lên một chút cho an toàn
        reservations:
          memory: 256M
    command: celery -A flashcardApi worker -l info --concurrency=2
    volumes:
      - .:/app
      - ./media:/app/media
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  ai_worker:
    build: .
    deploy:
      replicas: 2 # 2 con này "vít ga" 80 request AI song song như đã tính
    # Đây là nơi bạn chạy file script asyncio vừa refactor xong
    command: python -m utils.celery.worker
    working_dir: /app
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=flashcardApi.settings
      # Vẽ ảnh AI bằng ComfyUI trên máy host (xem .env.example, utils/image_gen); đặt IMAGE_GEN_ENABLED=true trong .env hoặc shell để bật
      - IMAGE_GEN_ENABLED=${IMAGE_GEN_ENABLED:-false}
    depends_on:
      - redis
      - db
    volumes:
      - .:/app


volumes:
  redis_data:
