version: "3.8"

services:
  db:
    image: postgres:15
    container_name: django_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=flashwise # <--- CHỖ CẦN SỬA 1: Tên Database
      - POSTGRES_USER=postgres # <--- CHỖ CẦN SỬA 2: User DB
      - POSTGRES_PASSWORD=hongson01 # <--- CHỖ CẦN SỬA 3: Password DB
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      ["5050:80"]
    depends_on:
      - db

  redis:
    image: redis/redis-stack-server:latest
    container_name: django_redis
    restart: always
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    deploy:
      resources:
        limits:
          memory: 2100M
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: django_web
    # container_name: django_web # Comment để sau này scale cho dễ
    command: uvicorn flashcardApi.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./media:/app/media # Thêm để đồng bộ với worker
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:hongson01@db:5432/flashwise
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: django_worker
    # deploy:
    #   replicas: 4
    #   resources:
    #     limits:
    #       memory: 1G # Nâng lên một chút cho an toàn
    #     reservations:
    #       memory: 256M
    # command: celery -A flashcardApi worker -l info -P gevent -c 30 --without-gossip --without-mingle
    command: celery -A flashcardApi worker -l info --concurrency=4
    volumes:
      - .:/app
      - ./media:/app/media
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:hongson01@db:5432/flashwise
    depends_on:
      - redis
      - db

volumes:
  redis_data:
  postgres_data: # Nên khai báo rõ ở đây