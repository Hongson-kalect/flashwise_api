version: "3.8"

services:
  db:
    image: postgres:15
    container_name: django_db
    # Không mở port ra ngoài Windows
    ports:
      - "5433:5432" # <--- MỞ CỔNG Ở ĐÂY (Ngoài:Trong)
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=flashwise # <--- CHỖ CẦN SỬA 1: Tên Database
      - POSTGRES_USER=postgres # <--- CHỖ CẦN SỬA 2: User DB
      - POSTGRES_PASSWORD=hongson01 # <--- CHỖ CẦN SỬA 3: Password DB
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      ["5050:80"]
    depends_on:
      - db

  redis:
    image: redis/redis-stack-server:latest # Use the lightweight, standard version
    container_name: django_redis
    restart: always
    # command: >
    #   redis-server 
    #   --maxmemory-policy allkeys-lru
    #   --appendonly yes
    volumes:
      - redis_data:/data
    # Không mở port, web và worker vẫn thấy nó qua tên "redis"

  web:
    build: .
    container_name: django_web
    command: uvicorn flashcardApi.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    # container_name: django_worker
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G # Nâng lên một chút cho an toàn
        reservations:
          memory: 256M
    command: celery -A flashcardApi worker -l info --concurrency=2
    volumes:
      - .:/app
      - ./media:/app/media
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  ai_worker:
    build: .
    deploy:
      replicas: 2 # 2 con này "vít ga" 80 request AI song song như đã tính
    # Đây là nơi bạn chạy file script asyncio vừa refactor xong
    command: python -m utils.celery.worker
    working_dir: /app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=flashcardApi.settings
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
      

volumes:
  redis_data:
